<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국어 개념 마스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2130;--sub:#6b7385;--line:#e2e6ef;--pri:#4f5bd5;--ok:#1f9d55;--okbg:#e5f6ec;--no:#d64545;--nobg:#fdeaea;--chip:#eceffa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141c;--card:#1b2030;--ink:#e8ebf3;--sub:#9aa2b5;--line:#2c3346;--pri:#8b94ff;--ok:#4ccf85;--okbg:#153524;--no:#ff7676;--nobg:#3a1d1f;--chip:#252b3d}}
:root[data-theme="dark"]{--bg:#11141c;--card:#1b2030;--ink:#e8ebf3;--sub:#9aa2b5;--line:#2c3346;--pri:#8b94ff;--ok:#4ccf85;--okbg:#153524;--no:#ff7676;--nobg:#3a1d1f;--chip:#252b3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
header{flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin:2px 0 4px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
main{flex:1;min-height:0;margin:10px 0;background:var(--card);border-radius:16px;padding:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
#fit{font-size:17px;display:flex;flex-direction:column;gap:.55em}
.unit{font-size:.7em;color:var(--pri);font-weight:600}
.q{font-weight:600;line-height:1.45;word-break:keep-all}
.cs{display:flex;flex-direction:column;gap:.4em}
.c{display:flex;gap:.5em;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9em;line-height:1.4;padding:.5em .65em;border-radius:10px;cursor:pointer;word-break:keep-all}
.c b{flex:none;color:var(--sub);font-weight:600}
.c.ok{border-color:var(--ok);background:var(--okbg)}
.c.no{border-color:var(--no);background:var(--nobg)}
.c:disabled{cursor:default;color:var(--ink)}
.ex{font-size:.82em;line-height:1.5;padding:.6em .75em;border-radius:10px;background:var(--chip);word-break:keep-all}
.ex strong{display:block;margin-bottom:.15em}
.ex.ok strong{color:var(--ok)}.ex.no strong{color:var(--no)}
footer{flex:none;display:flex;gap:10px}
footer button{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
footer #next{background:var(--pri);color:#fff}
footer button:disabled{opacity:.4;cursor:default}
.empty{margin:auto;text-align:center;color:var(--sub);line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="chips" id="chips"></div>
    <div class="meta"><span id="pos"></span><span id="range"></span></div>
    <div class="bar"><i id="barf"></i></div>
  </header>
  <main id="main"><div id="fit"></div></main>
  <footer><button id="prev">이전</button><button id="next">다음</button></footer>
</div>
<script>

let filter = 'all', list = [], idx = 0, state = {};
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function build() {
  let qs = DATA.questions;
  if (filter === 'review') qs = qs.filter((q) => review.has(q.id));
  else if (filter !== 'all') qs = qs.filter((q) => q.u === filter);
  list = shuffle(qs).map((q) => ({ q, order: shuffle([0, 1, 2, 3, 4]) }));
  idx = 0; state = {};
  render();
}

function chips() {
  const items = [['all', '전체'], ...DATA.units.map((u) => [u.id, u.name]), ['review', `다시 볼 문제 ${review.size}`]];
  document.getElementById('chips').innerHTML = items.map(([id, n]) => `<button class="chip${id === filter ? ' on' : ''}" data-f="${id}">${esc(n)}</button>`).join('');
  const u = DATA.units.find((x) => x.id === filter);
  document.getElementById('range').textContent = u ? u.range : '';
}

function render() {
  chips();
  const fit = document.getElementById('fit');
  const N = list.length;
  document.getElementById('pos').textContent = N ? `${idx + 1} / ${N}` : '0 / 0';
  document.getElementById('barf').style.width = N ? `${((idx + 1) / N) * 100}%` : '0';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx >= N - 1;
  if (!N) { fit.innerHTML = '<p class="empty">다시 볼 문제가 없습니다.<br>틀린 문제가 여기에 모입니다.</p>'; autofit(); return; }
  const { q, order } = list[idx];
  const picked = state[idx];
  const done = picked !== undefined;
  let h = `<div class="unit">${esc(unitName[q.u])}</div><div class="q">${esc(q.q)}</div><div class="cs">`;
  order.forEach((ci, k) => {
    let cls = '';
    if (done) { if (ci === q.a) cls = ' ok'; else if (ci === picked) cls = ' no'; }
    h += `<button class="c${cls}" data-ci="${ci}"${done ? ' disabled' : ''}><b>${'①②③④⑤'[k]}</b><span>${esc(q.c[ci])}</span></button>`;
  });
  h += '</div>';
  if (done) {
    const ok = picked === q.a;
    h += `<div class="ex ${ok ? 'ok' : 'no'}"><strong>${ok ? '정답입니다' : '틀렸습니다 · 정답 ' + '①②③④⑤'[order.indexOf(q.a)]}</strong>${esc(q.e)}</div>`;
  }
  fit.innerHTML = h;
  autofit();
}

// 내용이 카드 안에 다 들어갈 때까지 글자 크기를 줄인다 (스크롤 없음)
function autofit() {
  const main = document.getElementById('main'), fit = document.getElementById('fit');
  const max = main.clientHeight - 28;
  let size = Math.min(19, Math.max(15, window.innerWidth / 24));
  fit.style.fontSize = size + 'px';
  while (fit.scrollHeight > max && size > 9) { size -= 0.5; fit.style.fontSize = size + 'px'; }
}

function pick(ci) {
  if (state[idx] !== undefined) return;
  state[idx] = ci;
  const q = list[idx].q;
  if (ci === q.a) review.delete(q.id); else review.add(q.id);
  saveReview();
  render();
}
function go(d) { const n = idx + d; if (n >= 0 && n < list.length) { idx = n; render(); } }

document.getElementById('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { filter = b.dataset.f; build(); } });
document.getElementById('fit').addEventListener('click', (e) => { const b = e.target.closest('.c'); if (b) pick(+b.dataset.ci); });
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '5' && list[idx]) pick(list[idx].order[+e.key - 1]);
  else if (e.key === 'ArrowRight' || e.key === 'Enter') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});
window.addEventListener('resize', autofit);
if (document.fonts) document.fonts.ready.then(autofit);
build();
</script>
</body>
</html>
